# Dev layout: main editor left (70%), server + tasks stacked right (30%)
#
# ┌─────────────────────────────────────┬──────────────────┐
# │                                     │   dev server     │
# │           editor/claude             │   (npm run dev)  │
# │              (70%)                  ├──────────────────┤
# │                                     │   tasks/git      │
# └─────────────────────────────────────┴──────────────────┘
#
# Usage: prefix + D

# Kill extra panes, start fresh with one
select-pane -t :.1
kill-pane -a

# Split right 30%
split-window -h -l 30%

# Split the right side vertically
select-pane -t :.2
split-window -v -l 50%

# Select main pane
select-pane -t :.1
