# Focus layout: single full-screen pane for deep work
#
# ┌────────────────────────────────────────────────────────┐
# │                                                        │
# │                    single pane                         │
# │                   (full screen)                        │
# │                                                        │
# └────────────────────────────────────────────────────────┘
#
# Usage: prefix + F (after binding)

# Kill all other panes
select-pane -t :.1
kill-pane -a
