# tmux configuration

# =============================================================================
# General Settings
# =============================================================================

# Change prefix from Ctrl-b to Ctrl-a (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support for scrolling, selecting, and resizing
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Faster escape time (important for Vim/Neovim)
set -sg escape-time 10

# Increase scrollback buffer
set -g history-limit 50000

# Enable focus events (for Vim autoread, etc.)
set -g focus-events on

# Automatic window renaming
setw -g automatic-rename on
set -g set-titles on

# =============================================================================
# Key Bindings
# =============================================================================

# Reload config shortcut
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Intuitive split keys (and open in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick pane cycling with Ctrl-a Ctrl-a
bind C-a last-window

# =============================================================================
# Copy Mode (Vi-style)
# =============================================================================

# Use vi keys in copy mode
setw -g mode-keys vi

# Vi-style copy bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Enter copy mode with prefix + [
bind [ copy-mode

# Paste with prefix + p
bind p paste-buffer

# =============================================================================
# Visual Settings
# =============================================================================

# True color support (24-bit)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Status bar position
set-option -g status-position top

# Status bar styling
set -g status-style bg=default,fg=white
set -g status-interval 5

# Left side: session name + git branch
set -g status-left-length 60
set -g status-left "#[fg=cyan,bold][#S]#[fg=white] #(~/.tmux/scripts/git_branch.sh '#{pane_current_path}') "

# Right side: VPN | CPU/MEM | Battery | Weather | user@host | date | time
set -g status-right-length 160
set -g status-right "#(~/.tmux/scripts/vpn.sh) | #(~/.tmux/scripts/cpu_mem.sh) | #(~/.tmux/scripts/battery.sh) | #(~/.tmux/scripts/weather.sh) | #[fg=magenta]#(whoami)@#h#[fg=white] | #[fg=yellow]%a %b %d#[fg=white] | #[fg=green]%H:%M#[fg=white] "

# Center: window list
set -g status-justify left
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=black,bg=cyan,bold] #I:#W "

# Pane borders
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=cyan

# Message styling
set -g message-style bg=cyan,fg=black,bold

# =============================================================================
# Plugins (TPM - Tmux Plugin Manager)
# =============================================================================
# Install TPM: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then press prefix + I to install plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'

# Continuum settings (auto-save every 15 min, auto-restore on tmux start)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
