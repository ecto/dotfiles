# tmux configuration

# =============================================================================
# General Settings
# =============================================================================

# Use Ctrl-a as prefix (easier to reach than Ctrl-b)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Enable mouse support for scrolling, selecting, and resizing
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Faster escape time (important for Vim/Neovim)
set -sg escape-time 10

# Increase scrollback buffer
set -g history-limit 50000

# Enable focus events (for Vim autoread, etc.)
set -g focus-events on

# Automatic window renaming
setw -g automatic-rename on
set -g set-titles on

# =============================================================================
# Key Bindings
# =============================================================================

# Reload config shortcut
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Intuitive split keys (and open in current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation (fallback - vim-tmux-navigator handles Ctrl-hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Smart pane switching with awareness of Vim splits (vim-tmux-navigator)
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\\\'  'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window cycling with prefix prefix
bind C-a last-window

# Claude AI - natural language tmux control (Ctrl-b Shift-C)
# Opens Claude in a bottom composer popup - use /tmux skill
bind C display-popup -E -w 80% -h 12 -y 100% "claude"

# Layout presets
bind D source-file ~/.tmux/layouts/dev.conf    # Dev: editor + server + tasks
bind F source-file ~/.tmux/layouts/focus.conf  # Focus: single pane

# =============================================================================
# Copy Mode (Vi-style)
# =============================================================================

# Use vi keys in copy mode
setw -g mode-keys vi

# Vi-style copy bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Enter copy mode with prefix + [
bind [ copy-mode

# Paste with prefix + p
bind p paste-buffer

# =============================================================================
# Visual Settings
# =============================================================================

# True color support (24-bit)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Status bar position
set-option -g status-position top
set -g status-interval 5

# Status bar - using Catppuccin modules + custom scripts
# Left: session + git branch
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session} #(~/.tmux/scripts/git_branch.sh '#{pane_current_path}') "

# Right: custom scripts + date/time
set -g status-right-length 200
set -g status-right "#(~/.tmux/scripts/vpn.sh) | #(~/.tmux/scripts/cpu_mem.sh) | #(~/.tmux/scripts/battery.sh) | #(~/.tmux/scripts/weather.sh) | #{E:@catppuccin_status_date_time}"

set -g @catppuccin_date_time_text '%a %b %d %H:%M'

# Window list
set -g status-justify left

# Pane borders (Catppuccin styled)
set -g @catppuccin_pane_border_style 'fg=#{@thm_surface_0}'
set -g @catppuccin_pane_active_border_style 'fg=#{@thm_lavender}'

# =============================================================================
# Plugins (TPM - Tmux Plugin Manager)
# =============================================================================
# Install TPM: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then press prefix + I to install plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Session management - fuzzy finder for sessions/windows
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-enabled 'true'

# Floating panes / popups
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-bind 'f'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'cyan'
set -g @floax-change-path 'true'

# Quick copy - select URLs, paths, hashes with hints
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-key 'Space'
set -g @thumbs-command 'echo -n {} | pbcopy'
set -g @thumbs-upcase-command 'open {}'

# Catppuccin theme
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'

# Catppuccin status bar modules
set -g @catppuccin_window_default_text '#W'
set -g @catppuccin_window_current_text '#W'
set -g @catppuccin_status_background 'default'

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'

# Continuum settings (auto-save every 15 min, auto-restore on tmux start)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
